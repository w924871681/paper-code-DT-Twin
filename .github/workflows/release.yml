name: publish-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare checksum-bound Level-C assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source-assets release-assets
          gh release download v1.1.4 \
            --pattern "*_v1.1.4.zip" \
            --dir source-assets
          test "$(stat -c%s source-assets/level_c_bootstrap_v1.1.4.zip)" = "64258937"
          test "$(stat -c%s source-assets/cuda_replay_evidence_v1.1.4.zip)" = "239612"
          echo "365df44a8cf4de1cabb21dd21aa6e865aff83a3f30d083e91caf18ed744ef650  source-assets/level_c_bootstrap_v1.1.4.zip" | sha256sum -c -
          echo "40c2bca3909142326df77f7af5c1698c6bbcc152eb7d36b28c147f0d4aa8a215  source-assets/cuda_replay_evidence_v1.1.4.zip" | sha256sum -c -
          python scripts/verify_release_evidence.py \
            source-assets/cuda_replay_evidence_v1.1.4.zip
          cp source-assets/level_c_bootstrap_v1.1.4.zip \
            "release-assets/level_c_bootstrap_${GITHUB_REF_NAME}.zip"
          cp source-assets/cuda_replay_evidence_v1.1.4.zip \
            "release-assets/cuda_replay_evidence_${GITHUB_REF_NAME}.zip"
          cd release-assets
          sha256sum "level_c_bootstrap_${GITHUB_REF_NAME}.zip" > \
            "level_c_bootstrap_${GITHUB_REF_NAME}.zip.sha256"
          sha256sum "cuda_replay_evidence_${GITHUB_REF_NAME}.zip" > \
            "cuda_replay_evidence_${GITHUB_REF_NAME}.zip.sha256"
      - name: Build paper-alignment asset
        run: |
          python -m pip install --disable-pip-version-check \
            numpy matplotlib Pillow pypdf
          python scripts/generate_paper_outputs.py
          cd outputs/paper_outputs
          zip -X -r "../../release-assets/paper_alignment_${GITHUB_REF_NAME}.zip" .
          cd ../../release-assets
          sha256sum "paper_alignment_${GITHUB_REF_NAME}.zip" > \
            "paper_alignment_${GITHUB_REF_NAME}.zip.sha256"
      - name: Build complete archive from the public allowlist
        run: |
          python scripts/build_release_package.py \
            --out-dir release-assets \
            --version "${GITHUB_REF_NAME}"
          python scripts/check_release_hygiene.py \
            "release-assets/msa_dti_${GITHUB_REF_NAME}_complete.zip"
      - name: Build final figure-code asset
        run: |
          mkdir -p figure-code-package/scripts figure-code-package/paper_assets \
            figure-code-package/paper/figures \
            figure-code-package/results/main \
            figure-code-package/results/robustness \
            figure-code-package/results/supplementary \
            figure-code-package/results/audited_provenance
          cp -r reporting figure-code-package/
          cp scripts/generate_paper_outputs.py \
            scripts/generate_fig_overall_performance.py \
            scripts/validate_paper_outputs.py figure-code-package/scripts/
          cp -r configs figure-code-package/
          cp -r results/figure_data figure-code-package/results/
          cp results/main/alibaba_semi_real.csv \
            results/main/baseline_fairness.csv \
            results/main/center_type_robustness.csv \
            results/main/component_ablation.csv \
            results/main/horizon_support_robustness.csv \
            results/main/mechanism_and_cost.csv \
            results/main/overall_comparison.csv \
            figure-code-package/results/main/
          cp results/robustness/alibaba_oracle_diagnostics.csv \
            results/robustness/controlled_source_scale.csv \
            results/robustness/source_bank_seed.csv \
            figure-code-package/results/robustness/
          cp results/supplementary/optimizer_matched_control_summary.csv \
            results/supplementary/repeated_runtime_summary.csv \
            figure-code-package/results/supplementary/
          cp results/audited_provenance/fig12_case_level_gain_manifest.json \
            figure-code-package/results/audited_provenance/
          cp -r paper_assets/current_figures figure-code-package/paper_assets/
          cp -r paper/tables figure-code-package/paper/
          cp paper/figures/fig_overall_performance_ours.pdf \
            figure-code-package/paper/figures/
          cp docs/FIGURE_REPRODUCTION.md requirements.txt \
            figure-code-package/
          cd figure-code-package
          zip -X -r "../release-assets/MSA_DTI_FIGURE_CODE_${GITHUB_REF_NAME}.zip" .
          cd ../release-assets
          sha256sum "MSA_DTI_FIGURE_CODE_${GITHUB_REF_NAME}.zip" > \
            "MSA_DTI_FIGURE_CODE_${GITHUB_REF_NAME}.zip.sha256"
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          test -f "${NOTES_FILE}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${NOTES_FILE}" \
              --latest
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${NOTES_FILE}" \
              --latest
          fi
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "release-assets/level_c_bootstrap_${GITHUB_REF_NAME}.zip" \
            "release-assets/level_c_bootstrap_${GITHUB_REF_NAME}.zip.sha256" \
            "release-assets/cuda_replay_evidence_${GITHUB_REF_NAME}.zip" \
            "release-assets/cuda_replay_evidence_${GITHUB_REF_NAME}.zip.sha256" \
            "release-assets/paper_alignment_${GITHUB_REF_NAME}.zip" \
            "release-assets/paper_alignment_${GITHUB_REF_NAME}.zip.sha256" \
            "release-assets/msa_dti_${GITHUB_REF_NAME}_complete.zip" \
            "release-assets/msa_dti_${GITHUB_REF_NAME}_complete.zip.sha256" \
            "release-assets/MSA_DTI_FIGURE_CODE_${GITHUB_REF_NAME}.zip" \
            "release-assets/MSA_DTI_FIGURE_CODE_${GITHUB_REF_NAME}.zip.sha256" \
            "release-assets/SHA256SUMS.txt" \
            --clobber
      - name: Download and verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded-assets
          gh release download "${GITHUB_REF_NAME}" \
            --pattern "*" \
            --dir downloaded-assets
          cd downloaded-assets
          sha256sum -c "level_c_bootstrap_${GITHUB_REF_NAME}.zip.sha256"
          sha256sum -c "cuda_replay_evidence_${GITHUB_REF_NAME}.zip.sha256"
          sha256sum -c "paper_alignment_${GITHUB_REF_NAME}.zip.sha256"
          sha256sum -c "msa_dti_${GITHUB_REF_NAME}_complete.zip.sha256"
          sha256sum -c "MSA_DTI_FIGURE_CODE_${GITHUB_REF_NAME}.zip.sha256"
          sha256sum -c SHA256SUMS.txt
          python ../scripts/check_release_hygiene.py \
            "msa_dti_${GITHUB_REF_NAME}_complete.zip"
          python -c "import zipfile,sys;n=zipfile.ZipFile('msa_dti_${GITHUB_REF_NAME}_complete.zip').namelist();sys.exit(0 if any(x.startswith('results/main/') for x in n) else 1)"
          python ../scripts/verify_release_evidence.py \
            "cuda_replay_evidence_${GITHUB_REF_NAME}.zip"
          test "$(stat -c%s "level_c_bootstrap_${GITHUB_REF_NAME}.zip")" = "64258937"
          test "$(stat -c%s "cuda_replay_evidence_${GITHUB_REF_NAME}.zip")" = "239612"
      - name: Verify published release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "${GITHUB_REF_NAME}" --json isPrerelease --jq .isPrerelease)" = "false"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" = "${GITHUB_REF_NAME}"
